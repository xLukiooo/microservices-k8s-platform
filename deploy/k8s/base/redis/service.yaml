apiVersion: v1
kind: Service
metadata:
  labels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: database
  name: redis
  namespace: order-platform
spec:
  ports:
  - name: redis
    port: 6379
    protocol: TCP
    targetPort: 6379
  - name: metrics
    port: 9121
    protocol: TCP
    targetPort: 9121
  selector:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: database
  type: ClusterIP
