apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-api-network-policy
  namespace: order-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-api
      app.kubernetes.io/component: api
  policyTypes:
  - Ingress
  ingress:
    - ports:
      - protocol: TCP
        port: 8000