apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: order-api
    app.kubernetes.io/component: api
  name: order-api
  namespace: order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: order-api-serviceaccount
      containers:
      - image: xlukiooo/order-api:1.0
        name: order-api
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: order-platform-config
        - secretRef:
            name: order-platform-secret
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
