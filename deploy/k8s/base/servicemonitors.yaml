apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-api-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
    - order-platform
  selector:
    matchLabels:
      app.kubernetes.io/name: order-api
  endpoints:
  - port: 8000-8000
    path: /metrics
    interval: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-worker-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
    - order-platform
  selector:
    matchLabels:
      app.kubernetes.io/name: order-worker
  endpoints:
  - port: 9102-9102
    path: /metrics
    interval: 10s
---
