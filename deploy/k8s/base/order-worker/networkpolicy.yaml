apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-worker-network-policy
  namespace: order-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-worker
      app.kubernetes.io/component: worker
  policyTypes:
  - Ingress
  ingress:
    - ports:
      - protocol: TCP
        port: 9102