apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: order-worker
    app.kubernetes.io/component: worker
  name: order-worker
  namespace: order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: order-worker-serviceaccount
      containers:
      - image: xlukiooo/order-worker:1.0
        name: order-worker
        ports:
        - containerPort: 9102
        envFrom:
        - configMapRef:
            name: order-platform-config
        - secretRef:
            name: order-platform-secret
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9102
          initialDelaySeconds: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 9102
          initialDelaySeconds: 2
          periodSeconds: 5
