apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: order-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/component: ui
  policyTypes:
  - Ingress
  ingress:
    - ports:
      - protocol: TCP
        port: 80
